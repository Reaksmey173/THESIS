<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="630" viewBox="0 0 1660 630" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif">
<title>The GOP process on paper compared with the process in the system</title>
<desc>On paper the case passes through the Surgical Coordinator twice, giving eight steps. In the system Finance takes over those checks, reducing the flow to six steps, and the Coordinator monitors rather than acting.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="42" font-size="26" font-weight="600" fill="#26215C">Version 1 — on paper, Coordinator takes action</text>

<g><rect x="40" y="70" width="180" height="110" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="130" y="118" font-size="22" font-weight="600" fill="#26215C" text-anchor="middle">Surgeon</text><text x="130" y="148" font-size="16" fill="#534AB7" text-anchor="middle">starts and completes</text></g>
<g><rect x="240" y="70" width="180" height="110" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="330" y="118" font-size="22" font-weight="600" fill="#26215C" text-anchor="middle">Anaesthetist</text><text x="330" y="148" font-size="16" fill="#534AB7" text-anchor="middle">continues the case</text></g>
<g><rect x="440" y="70" width="180" height="110" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/><text x="530" y="118" font-size="22" font-weight="600" fill="#412402" text-anchor="middle">Coordinator</text><text x="530" y="148" font-size="16" fill="#854F0B" text-anchor="middle">checks the case</text></g>
<g><rect x="640" y="70" width="180" height="110" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="730" y="118" font-size="22" font-weight="600" fill="#26215C" text-anchor="middle">Finance</text><text x="730" y="148" font-size="16" fill="#534AB7" text-anchor="middle">builds the cost estimate</text></g>
<g><rect x="840" y="70" width="180" height="110" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/><text x="930" y="118" font-size="22" font-weight="600" fill="#412402" text-anchor="middle">Coordinator</text><text x="930" y="148" font-size="16" fill="#854F0B" text-anchor="middle">sends to the patient</text></g>
<g><rect x="1040" y="70" width="180" height="110" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/><text x="1130" y="118" font-size="22" font-weight="600" fill="#2C2C2A" text-anchor="middle">Patient</text><text x="1130" y="148" font-size="16" fill="#5F5E5A" text-anchor="middle">accepts or declines</text></g>
<g><rect x="1240" y="70" width="180" height="110" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="1330" y="118" font-size="22" font-weight="600" fill="#26215C" text-anchor="middle">Finance</text><text x="1330" y="148" font-size="16" fill="#534AB7" text-anchor="middle">mails the insurer</text></g>
<g><rect x="1440" y="70" width="180" height="110" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/><text x="1530" y="118" font-size="22" font-weight="600" fill="#2C2C2A" text-anchor="middle">Insurer</text><text x="1530" y="148" font-size="16" fill="#5F5E5A" text-anchor="middle">three answers</text></g>

<line x1="224" y1="125" x2="236" y2="125" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="424" y1="125" x2="436" y2="125" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="624" y1="125" x2="636" y2="125" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="824" y1="125" x2="836" y2="125" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="1024" y1="125" x2="1036" y2="125" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="1224" y1="125" x2="1236" y2="125" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="1424" y1="125" x2="1436" y2="125" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>

<text x="40" y="252" font-size="26" font-weight="600" fill="#26215C">Version 2 — in the system, Coordinator steps out of the flow</text>

<g><rect x="40" y="280" width="180" height="110" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="130" y="328" font-size="22" font-weight="600" fill="#26215C" text-anchor="middle">Surgeon</text><text x="130" y="358" font-size="16" fill="#534AB7" text-anchor="middle">starts and completes</text></g>
<g><rect x="240" y="280" width="180" height="110" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="330" y="328" font-size="22" font-weight="600" fill="#26215C" text-anchor="middle">Anaesthetist</text><text x="330" y="358" font-size="16" fill="#534AB7" text-anchor="middle">submits the case</text></g>
<g><rect x="440" y="280" width="580" height="110" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/><text x="730" y="328" font-size="22" font-weight="600" fill="#412402" text-anchor="middle">Finance</text><text x="730" y="358" font-size="16" fill="#854F0B" text-anchor="middle">checks the case, builds the cost estimate, and sends to the patient</text></g>
<g><rect x="1040" y="280" width="180" height="110" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/><text x="1130" y="328" font-size="22" font-weight="600" fill="#2C2C2A" text-anchor="middle">Patient</text><text x="1130" y="358" font-size="16" fill="#5F5E5A" text-anchor="middle">accepts or declines</text></g>
<g><rect x="1240" y="280" width="180" height="110" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="1330" y="328" font-size="22" font-weight="600" fill="#26215C" text-anchor="middle">Finance</text><text x="1330" y="358" font-size="16" fill="#534AB7" text-anchor="middle">mails the insurer</text></g>
<g><rect x="1440" y="280" width="180" height="110" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/><text x="1530" y="328" font-size="22" font-weight="600" fill="#2C2C2A" text-anchor="middle">Insurer</text><text x="1530" y="358" font-size="16" fill="#5F5E5A" text-anchor="middle">three answers</text></g>

<line x1="224" y1="335" x2="236" y2="335" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="424" y1="335" x2="436" y2="335" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="1024" y1="335" x2="1036" y2="335" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="1224" y1="335" x2="1236" y2="335" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="1424" y1="335" x2="1436" y2="335" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>

<line x1="730" y1="390" x2="730" y2="450" stroke="#639922" stroke-width="1.6" stroke-dasharray="6 5"/>
<g><rect x="440" y="450" width="580" height="90" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="2" stroke-dasharray="7 5"/><text x="730" y="488" font-size="22" font-weight="600" fill="#173404" text-anchor="middle">Coordinator</text><text x="730" y="516" font-size="16" fill="#3B6D11" text-anchor="middle">no longer a required step, but may still edit when asked</text></g>

<rect x="40" y="580" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="66" y="593" font-size="16" fill="#5F5E5A">hospital staff</text>
<rect x="240" y="580" width="16" height="16" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
<text x="266" y="593" font-size="16" fill="#5F5E5A">external party</text>
<rect x="450" y="580" width="16" height="16" rx="3" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/>
<text x="476" y="593" font-size="16" fill="#5F5E5A">differs between versions</text>
<rect x="740" y="580" width="16" height="16" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="2" stroke-dasharray="5 4"/>
<text x="766" y="593" font-size="16" fill="#5F5E5A">oversight, not a required step</text>
</svg>
