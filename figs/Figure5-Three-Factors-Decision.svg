<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif">
<title>The three factors evaluated in every access decision</title>
<desc>Three inputs are evaluated together for each request: the user's role, whether the case is assigned to them, and how far the case has progressed. Removing any one of the three changes the answer.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="50" y="60" width="340" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.8"/>
<text x="220" y="90" font-size="19" font-weight="600" fill="#26215C" text-anchor="middle">Role: Surgeon</text>
<text x="220" y="113" font-size="15" fill="#534AB7" text-anchor="middle">role-based access control</text>

<rect x="50" y="155" width="340" height="70" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.8"/>
<text x="220" y="185" font-size="19" font-weight="600" fill="#4A1B0C" text-anchor="middle">Assigned to this case</text>
<text x="220" y="208" font-size="15" fill="#993C1D" text-anchor="middle">attribute-based access control</text>

<rect x="50" y="250" width="340" height="70" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.8"/>
<text x="220" y="280" font-size="19" font-weight="600" fill="#04342C" text-anchor="middle">Case has not reached Finance</text>
<text x="220" y="303" font-size="15" fill="#0F6E56" text-anchor="middle">the case's step in the workflow</text>

<line x1="394" y1="95" x2="516" y2="175" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="394" y1="190" x2="516" y2="190" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="394" y1="285" x2="516" y2="205" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="520" y="145" width="170" height="90" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1.8"/>
<text x="605" y="176" font-size="19" font-weight="600" fill="#2C2C2A" text-anchor="middle">Access</text>
<text x="605" y="198" font-size="19" font-weight="600" fill="#2C2C2A" text-anchor="middle">decision</text>
<text x="605" y="219" font-size="14" fill="#5F5E5A" text-anchor="middle">checked in one module</text>

<line x1="694" y1="190" x2="746" y2="190" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="750" y="145" width="200" height="90" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.8"/>
<text x="850" y="181" font-size="19" font-weight="600" fill="#173404" text-anchor="middle">May edit the case</text>
<text x="850" y="205" font-size="14" fill="#3B6D11" text-anchor="middle">refused if any factor fails</text>

<text x="500" y="370" font-size="16" fill="#5F5E5A" text-anchor="middle">All three must hold. If any one fails, the action is refused.</text>
<text x="500" y="394" font-size="16" fill="#5F5E5A" text-anchor="middle">The third can change the answer even when the role and the assignment have not.</text>
</svg>
