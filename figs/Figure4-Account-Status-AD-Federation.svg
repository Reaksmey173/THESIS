<svg width="680" height="310" viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Figure 4: Account status after AD federation</title>
<desc>User enters AD credentials, Active Directory validates them, Keycloak federates the identity and issues a token, and the application checks whether the account is enabled in Keycloak and in its own record. Both must be true for access to be granted; otherwise access is refused and logged to the audit trail.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#3D3D3A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="310" fill="#FFFFFF"/>

<!-- Box 1: User -->
<rect x="40" y="55" width="140" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="110" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">User enters</text>
<text x="110" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">AD credentials</text>

<line x1="180" y1="90" x2="191" y2="90" stroke="#3D3D3A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Box 2: Active Directory (blue) -->
<rect x="193" y="55" width="140" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="263" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Active Directory</text>
<text x="263" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">Validates login</text>

<line x1="333" y1="90" x2="344" y2="90" stroke="#3D3D3A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Box 3: Keycloak (teal) -->
<rect x="346" y="55" width="140" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="416" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Keycloak</text>
<text x="416" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Federates identity,</text>
<text x="416" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">issues token</text>

<line x1="486" y1="90" x2="497" y2="90" stroke="#3D3D3A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Box 4: Application check -->
<rect x="499" y="55" width="140" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="569" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Application check</text>
<text x="569" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Keycloak enabled AND</text>
<text x="569" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">app enabled</text>

<line x1="569" y1="125" x2="503" y2="178" stroke="#3D3D3A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="569" y1="125" x2="594" y2="178" stroke="#3D3D3A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Outcome: Access granted (green) -->
<rect x="459" y="180" width="85" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="501" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#27500A">Access</text>
<text x="501" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#27500A">granted</text>

<!-- Outcome: Access refused (red) -->
<rect x="554" y="180" width="85" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="596" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#791F1F">Access</text>
<text x="596" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#791F1F">refused</text>

<text x="340" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">A Keycloak-side (AD-sourced) disable always locks the user out,</text>
<text x="340" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">even if the application's own record says enabled. An application-side</text>
<text x="340" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">disable also blocks access even if Keycloak allows it.</text>
</svg>
